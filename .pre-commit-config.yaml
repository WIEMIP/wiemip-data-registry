# Runs the ruff + black pinned in uv.lock, so the hook matches `uv run ruff` /
# `uv run black` by hand. Activate once per clone: `uv run pre-commit install`.
# --no-sync: a plain `uv run` re-locks when pre-commit has stashed an unstaged
# uv.lock, and pre-commit then fails the hook for "modifying" that file.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run --no-sync black
        language: system
        types: [python]
